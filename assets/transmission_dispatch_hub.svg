        <text x="24" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c084fc">𝕏</text>
        <text x="44" y="32" class="sans" font-size="13" font-weight="700" fill="#ffffff">X / Twitter</text>
        <text x="16" y="62" class="mono" font-size="9" fill="#94a3b8">AGI &amp; Swarm Intel</text>
        <text x="16" y="80" class="mono" font-size="9.5" fill="#c084fc">@jachinosonowal</text>
        <rect x="16" y="106" width="168" height="18" rx="3" fill="#1e1b4b"/>
        <text x="100" y="118" text-anchor="middle" class="mono" font-size="8" fill="#c084fc">DAILY SYSTEMS DISPATCH</text>
      </g>

      <!-- Channel 4: Portfolio OS -->
      <g transform="translate(630, 0)">
        <rect width="200" height="135" rx="8" fill="#041712" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="24" cy="28" r="10" fill="#064e3b"/>
        <text x="24" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#34d399">▲</text>
        <text x="44" y="32" class="sans" font-size="13" font-weight="700" fill="#ffffff">Portfolio OS</text>
        <text x="16" y="62" class="mono" font-size="9" fill="#94a3b8">Next.js 15 Vercel Edge</text>
        <text x="16" y="80" class="mono" font-size="9" fill="#34d399">jachinsaikiasonowal</text>
        <text x="16" y="94" class="mono" font-size="9" fill="#34d399">.vercel.app</text>
        <rect x="16" y="106" width="168" height="18" rx="3" fill="#064e3b"/>
        <text x="100" y="118" text-anchor="middle" class="mono" font-size="8" fill="#34d399">SUB-20ms TTFB</text>
      </g>

      <!-- Channel 5: Beehiiv Publication -->
      <g transform="translate(840, 0)">
        <rect width="200" height="135" rx="8" fill="#1f1406" stroke="#f59e0b" stroke-width="1.2"/>
        <circle cx="24" cy="28" r="10" fill="#78350f"/>
        <text x="24" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fbbf24">✦</text>
        <text x="44" y="32" class="sans" font-size="13" font-weight="700" fill="#ffffff">Matrix Labs</text>
        <text x="16" y="62" class="mono" font-size="9" fill="#94a3b8">Weekly AI Intelligence</text>
        <text x="16" y="80" class="mono" font-size="9" fill="#fbbf24">matrixlabs</text>
