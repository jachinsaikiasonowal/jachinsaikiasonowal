<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <radialGradient id="hubBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#081024" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#020612" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#010207" stop-opacity="1"/>
    </radialGradient>

    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="hubClip">
      <rect x="0" y="0" width="1100" height="240" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseTransmitter {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.8)); }
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, Roboto, sans-serif; }
    .pulse-tx { animation: pulseTransmitter 2.5s ease-in-out infinite; }
  </style>

  <g clip-path="url(#hubClip)">
    <rect width="1100" height="240" fill="url(#hubBg)"/>

    <!-- Header -->
    <g transform="translate(30, 30)">
      <circle cx="8" cy="8" r="4" fill="#00f2fe" class="pulse-tx" filter="url(#hubGlow)"/>
      <text x="24" y="12" class="mono" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="2">
        SECURE TRANSMISSION CHANNELS // DIRECT SIGNAL INGESTION
      </text>
      <text x="1040" y="12" text-anchor="end" class="mono" font-size="10.5" fill="#64748b" letter-spacing="1">
        256-BIT ENCRYPTED ROUTING
      </text>
    </g>

    <!-- Channels Grid: 5 High-Tech Cards -->
    <g transform="translate(30, 68)">
      <!-- Channel 1: Email -->
      <g transform="translate(0, 0)">
        <rect width="200" height="135" rx="8" fill="#040f21" stroke="#00f2fe" stroke-width="1.2"/>
        <circle cx="24" cy="28" r="10" fill="#0c233c"/>
        <text x="24" y="32" text-anchor="middle" class="mono" font-size="12" fill="#00f2fe">✉</text>
        <text x="44" y="32" class="sans" font-size="13" font-weight="700" fill="#ffffff">Email Dispatch</text>
        <text x="16" y="62" class="mono" font-size="9" fill="#94a3b8">Personal &amp; Direct</text>
        <text x="16" y="80" class="mono" font-size="9" fill="#38bdf8">jachinsaikiasonowal</text>
        <text x="16" y="94" class="mono" font-size="9" fill="#38bdf8">@gmail.com</text>
        <rect x="16" y="106" width="168" height="18" rx="3" fill="#0c233c"/>
        <text x="100" y="118" text-anchor="middle" class="mono" font-size="8" fill="#00f2fe">RESPONSE: &lt;24 HRS</text>
      </g>

      <!-- Channel 2: LinkedIn -->
      <g transform="translate(210, 0)">
        <rect width="200" height="135" rx="8" fill="#061226" stroke="#0284c7" stroke-width="1.2"/>
        <circle cx="24" cy="28" r="10" fill="#0c233c"/>
        <text x="24" y="32" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#38bdf8">in</text>
        <text x="44" y="32" class="sans" font-size="13" font-weight="700" fill="#ffffff">LinkedIn Network</text>
        <text x="16" y="62" class="mono" font-size="9" fill="#94a3b8">Executive &amp; Systems</text>
        <text x="16" y="80" class="mono" font-size="9.5" fill="#38bdf8">/in/jachinsaikiasonowal</text>
