<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <radialGradient id="metricsBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08142a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#020612" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#010207" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="barGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="barGradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="barGradEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="barGradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="mClip">
      <rect x="0" y="0" width="1100" height="320" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseGauges {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.7)); }
    }
    @keyframes statBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes barStretch1 {
      0%, 100% { width: 180px; }
      50% { width: 195px; }
    }
    @keyframes barStretch2 {
      0%, 100% { width: 130px; }
      50% { width: 140px; }
    }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, Roboto, sans-serif; }
    .gauge-glow { animation: pulseGauges 3s ease-in-out infinite; }
    .blink { animation: statBlink 2s ease-in-out infinite; }
    .anim-bar-1 { animation: barStretch1 5s ease-in-out infinite; }
    .anim-bar-2 { animation: barStretch2 6s ease-in-out infinite; }
  </style>

  <g clip-path="url(#mClip)">
    <rect width="1100" height="320" fill="url(#metricsBg)"/>

    <!-- Grid lines -->
    <g stroke="#1e293b" stroke-width="0.7" opacity="0.4">
      <line x1="360" y1="0" x2="360" y2="320"/>
      <line x1="720" y1="0" x2="720" y2="320"/>
      <line x1="0" y1="50" x2="1100" y2="50"/>
    </g>

    <!-- Top Dashboard Header -->
    <g transform="translate(30, 32)">
      <circle cx="8" cy="8" r="4" fill="#00f2fe" class="blink" filter="url(#mGlow)"/>
      <text x="24" y="12" class="mono" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="2">
        GITHUB PRODUCTION TELEMETRY // MISSION VELOCITY DASHBOARD
      </text>
      <text x="1040" y="12" text-anchor="end" class="mono" font-size="10.5" fill="#64748b" letter-spacing="1">
        DETERMINISTIC COMPUTE · 100% RELIABLE ZERO-OUTAGE
      </text>
    </g>

    <!-- ==================== CARD 1: REPOSITORY & COMMIT VELOCITY ==================== -->
    <g transform="translate(30, 75)">
      <rect width="310" height="220" rx="8" fill="#040c1a" stroke="#0284c7" stroke-width="1.2"/>
      <rect width="310" height="32" rx="8" fill="#0c233c"/>
      <text x="16" y="21" class="mono" font-size="11" font-weight="700" fill="#38bdf8">
        01 // CODEBASE VELOCITY
      </text>

      <g transform="translate(16, 52)">
        <!-- Stat Row 1 -->
        <text x="0" y="24" class="sans" font-size="28" font-weight="900" fill="#ffffff">1,500+</text>
        <text x="110" y="15" class="mono" font-size="10" font-weight="700" fill="#00f2fe">TOTAL COMMITS</text>
        <text x="110" y="28" class="mono" font-size="9" fill="#94a3b8">Continuous Engineering</text>

        <!-- Stat Row 2 -->
        <g transform="translate(0, 50)">
          <text x="0" y="24" class="sans" font-size="28" font-weight="900" fill="#c084fc">19+</text>
          <text x="75" y="15" class="mono" font-size="10" font-weight="700" fill="#c084fc">REPOSITORIES</text>
          <text x="75" y="28" class="mono" font-size="9" fill="#94a3b8">Systems, AGI &amp; Low-Level</text>
        </g>

        <!-- Stat Row 3 -->
        <g transform="translate(0, 100)">
          <text x="0" y="24" class="sans" font-size="28" font-weight="900" fill="#34d399">150+</text>
          <text x="85" y="15" class="mono" font-size="10" font-weight="700" fill="#34d399">STARS &amp; FORKS</text>
          <text x="85" y="28" class="mono" font-size="9" fill="#94a3b8">PromptMatrix OSS Registry</text>
        </g>
      </g>
    </g>

    <!-- ==================== CARD 2: LANGUAGE DISTRIBUTION ==================== -->
    <g transform="translate(365, 75)">
      <rect width="330" height="220" rx="8" fill="#08071e" stroke="#7c3aed" stroke-width="1.2"/>
      <rect width="330" height="32" rx="8" fill="#1e1b4b"/>
      <text x="16" y="21" class="mono" font-size="11" font-weight="700" fill="#c084fc">
        02 // LANGUAGE CONSTELLATION
      </text>

      <g transform="translate(16, 50)">
        <!-- Lang 1: Python -->
        <text x="0" y="12" class="mono" font-size="10.5" font-weight="700" fill="#f8fafc">Python (SDK, CLI, Swarms)</text>
        <text x="290" y="12" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8">42%</text>
        <rect x="0" y="18" width="290" height="8" rx="4" fill="#1e293b"/>
        <rect x="0" y="18" width="122" height="8" rx="4" fill="url(#barGradCyan)"/>

        <!-- Lang 2: TypeScript & Web -->
        <g transform="translate(0, 36)">
          <text x="0" y="12" class="mono" font-size="10.5" font-weight="700" fill="#f8fafc">TypeScript &amp; Next.js 15</text>
          <text x="290" y="12" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#c084fc">28%</text>
          <rect x="0" y="18" width="290" height="8" rx="4" fill="#1e293b"/>
          <rect x="0" y="18" width="81" height="8" rx="4" fill="url(#barGradPurple)"/>
        </g>

        <!-- Lang 3: C99 & RISC-V -->
        <g transform="translate(0, 72)">
          <text x="0" y="12" class="mono" font-size="10.5" font-weight="700" fill="#f8fafc">C99 &amp; RV32I Assembly</text>
          <text x="290" y="12" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#34d399">18%</text>
          <rect x="0" y="18" width="290" height="8" rx="4" fill="#1e293b"/>
          <rect x="0" y="18" width="52" height="8" rx="4" fill="url(#barGradEmerald)"/>
        </g>

        <!-- Lang 4: SQL & POSIX Shell -->
        <g transform="translate(0, 108)">
          <text x="0" y="12" class="mono" font-size="10.5" font-weight="700" fill="#f8fafc">SQL, IPC &amp; POSIX Shell</text>
          <text x="290" y="12" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#fbbf24">12%</text>
          <rect x="0" y="18" width="290" height="8" rx="4" fill="#1e293b"/>
          <rect x="0" y="18" width="35" height="8" rx="4" fill="url(#barGradAmber)"/>
        </g>
      </g>
    </g>

    <!-- ==================== CARD 3: FIELD SLA & REVENUE IMPACT ==================== -->
    <g transform="translate(720, 75)">
      <rect width="350" height="220" rx="8" fill="#041712" stroke="#059669" stroke-width="1.2"/>
      <rect width="350" height="32" rx="8" fill="#064e3b"/>
      <text x="16" y="21" class="mono" font-size="11" font-weight="700" fill="#34d399">
        03 // REVENUE &amp; SLA PERFORMANCE
      </text>

      <g transform="translate(16, 52)">
        <text x="0" y="24" class="sans" font-size="28" font-weight="900" fill="#34d399">$2.5M+</text>
        <text x="120" y="15" class="mono" font-size="10" font-weight="700" fill="#34d399">PIPELINE VALUE</text>
        <text x="120" y="28" class="mono" font-size="9" fill="#94a3b8">3.8x Aggregate ROAS</text>

        <g transform="translate(0, 50)">
          <text x="0" y="24" class="sans" font-size="28" font-weight="900" fill="#00f2fe">&lt;4.8ms</text>
          <text x="120" y="15" class="mono" font-size="10" font-weight="700" fill="#00f2fe">P99 PROMPT LATENCY</text>
          <text x="120" y="28" class="mono" font-size="9" fill="#94a3b8">In-Memory PromptMatrix</text>
        </g>

        <g transform="translate(0, 100)">
          <text x="0" y="24" class="sans" font-size="28" font-weight="900" fill="#fbbf24">25+</text>
          <text x="75" y="15" class="mono" font-size="10" font-weight="700" fill="#fbbf24">LIVE AI SWARMS</text>
          <text x="75" y="28" class="mono" font-size="9" fill="#94a3b8">&lt;90s Dispatch Speed</text>
        </g>
      </g>
    </g>
  </g>
</svg>
