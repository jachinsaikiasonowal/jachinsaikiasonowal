<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a192f" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#030712" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#02040a" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="laserGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gridLineFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters for Bloom/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanning Line Clip -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="420" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-420px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.4)); }
      50% { opacity: 0.85; filter: drop-shadow(0 0 22px rgba(0, 242, 254, 0.9)); }
    }
    @keyframes pulseStatus {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterSpin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes textGlitch {
      0%, 94%, 100% { transform: skew(0deg); }
      95% { transform: skew(3deg) translate(-2px, 1px); }
      97% { transform: skew(-2deg) translate(2px, -1px); }
    }

    .hud-text { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', 'Roboto', monospace; }
    .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    
    .scan-beam { animation: scanline 6s ease-in-out infinite; }
    .node-pulse { animation: pulseGlow 3.5s ease-in-out infinite; }
    .status-dot { animation: pulseStatus 2s infinite ease-in-out; }
    .circuit-line { stroke-dasharray: 12 18; animation: circuitFlow 20s linear infinite; }
    .fast-circuit { stroke-dasharray: 8 12; animation: circuitFlow 10s linear infinite; }
    .radar-orbit { transform-origin: 1040px 210px; animation: orbitSpin 18s linear infinite; }
    .radar-inner { transform-origin: 1040px 210px; animation: counterSpin 12s linear infinite; }
    .particle { animation: floatParticle 4s ease-in-out infinite; }
    .hero-title { animation: textGlitch 8s infinite; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Base Background -->
    <rect width="1200" height="420" fill="url(#bgGlow)"/>

    <!-- Perspective Grid Lines -->
    <g stroke="url(#gridLineFade)" stroke-width="1" opacity="0.6">
      <!-- Horizontal Lines -->
      <line x1="0" y1="60" x2="1200" y2="60"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="360" x2="1200" y2="360"/>
      <!-- Vertical Lines -->
      <line x1="100" y1="0" x2="100" y2="420"/>
      <line x1="250" y1="0" x2="250" y2="420"/>
      <line x1="400" y1="0" x2="400" y2="420"/>
      <line x1="550" y1="0" x2="550" y2="420"/>
      <line x1="700" y1="0" x2="700" y2="420"/>
      <line x1="850" y1="0" x2="850" y2="420"/>
      <line x1="1000" y1="0" x2="1000" y2="420"/>
      <line x1="1150" y1="0" x2="1150" y2="420"/>
    </g>

    <!-- Animated Data Circuit Conduits -->
    <g fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.45">
      <path d="M 0 90 L 320 90 L 380 150 L 720 150 L 760 110 L 1200 110" class="circuit-line"/>
      <path d="M 0 330 L 280 330 L 340 270 L 640 270 L 680 310 L 1200 310" class="fast-circuit" stroke="#a855f7"/>
      <path d="M 450 0 L 450 180 L 520 250 L 520 420" class="circuit-line" stroke="#10b981"/>
    </g>

    <!-- Ambient Glowing Orb Backdrops -->
    <circle cx="220" cy="180" r="140" fill="#00f2fe" opacity="0.07" filter="url(#glow)"/>
    <circle cx="680" cy="220" r="160" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
    <circle cx="1040" cy="210" r="130" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>

    <!-- High-Tech Radar HUD Geometry (Right Section) -->
    <g id="radar-hud">
      <!-- Outer Hexagon Matrix -->
      <polygon points="1040,100 1135,155 1135,265 1040,320 945,265 945,155" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.3" stroke-dasharray="6 4"/>
      <!-- Outer Orbit Ring -->
      <g class="radar-orbit">
        <circle cx="1040" cy="210" r="88" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="140 30 40 20" opacity="0.75"/>
        <circle cx="1040" cy="122" r="4" fill="#00f2fe" filter="url(#glow)"/>
        <circle cx="1128" cy="210" r="3" fill="#38bdf8"/>
      </g>
      <!-- Middle Counter Orbit -->
      <g class="radar-inner">
        <circle cx="1040" cy="210" r="62" fill="none" stroke="url(#neonViolet)" stroke-width="1.2" stroke-dasharray="70 25 15 15" opacity="0.85"/>
        <circle cx="1040" cy="148" r="3.5" fill="#a855f7" filter="url(#glow)"/>
      </g>
      <!-- Core Telemetry Radar Node -->
      <circle cx="1040" cy="210" r="36" fill="#050b1a" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>
      <circle cx="1040" cy="210" r="12" fill="url(#neonCyan)" filter="url(#glow)" class="node-pulse"/>
      <circle cx="1040" cy="210" r="4" fill="#ffffff"/>

      <!-- Crosshairs -->
      <line x1="930" y1="210" x2="1150" y2="210" stroke="#00f2fe" stroke-width="0.8" opacity="0.3" stroke-dasharray="4 4"/>
      <line x1="1040" y1="100" x2="1040" y2="320" stroke="#00f2fe" stroke-width="0.8" opacity="0.3" stroke-dasharray="4 4"/>

      <!-- Radar Telemetry Label Badges -->
      <rect x="965" y="335" width="150" height="22" rx="4" fill="#050e1f" stroke="#00f2fe" stroke-width="0.8" opacity="0.7"/>
      <text x="1040" y="350" text-anchor="middle" class="mono-text" font-size="9" fill="#38bdf8" letter-spacing="1.5">SWARM NODE // 25 PROD</text>
    </g>

    <!-- Floating Micro Quantum Particles -->
    <g fill="#00f2fe" opacity="0.6">
      <circle cx="180" cy="70" r="1.5" class="particle"/>
      <circle cx="340" cy="360" r="2" class="particle" style="animation-delay: 1s;"/>
      <circle cx="580" cy="80" r="1.5" class="particle" style="animation-delay: 2s;"/>
      <circle cx="820" cy="340" r="2.5" class="particle" style="animation-delay: 1.5s;"/>
      <circle cx="920" cy="90" r="1.5" class="particle" style="animation-delay: 0.5s;"/>
    </g>

    <!-- Futuristic Top Status Bar -->
    <g id="top-status-bar">
      <!-- Status Chip 1: System Mode -->
      <rect x="60" y="36" width="170" height="26" rx="13" fill="#081426" stroke="#00f2fe" stroke-width="1" opacity="0.9"/>
      <circle cx="78" cy="49" r="4" fill="#10b981" class="status-dot" filter="url(#glow)"/>
      <text x="92" y="53" class="mono-text" font-size="10.5" font-weight="600" fill="#34d399" letter-spacing="1">STATUS: OPERATIONAL</text>

      <!-- Status Chip 2: Control Plane -->
      <rect x="245" y="36" width="180" height="26" rx="13" fill="#0f0c24" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <polygon points="262,49 266,43 270,49 266,55" fill="#818cf8"/>
      <text x="278" y="53" class="mono-text" font-size="10.5" font-weight="600" fill="#c7d2fe" letter-spacing="1">PROMPTMATRIX // v1.2</text>

      <!-- Status Chip 3: Latency Spec -->
      <rect x="440" y="36" width="150" height="26" rx="13" fill="#1a1408" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
      <text x="455" y="53" class="mono-text" font-size="10.5" font-weight="600" fill="#fbbf24" letter-spacing="1">⚡ LATENCY: &lt;5ms</text>

      <!-- Protocol Timestamp Token -->
      <text x="880" y="53" text-anchor="end" class="mono-text" font-size="10" fill="#64748b" letter-spacing="1.5">SYS.ARCH // RV32I · AGI · REVOPS</text>
    </g>

    <!-- Main Typography Core (Left & Center) -->
    <g transform="translate(60, 110)">
      <!-- System Identity Tagline -->
      <text x="0" y="24" class="mono-text" font-size="13" font-weight="700" fill="#00f2fe" letter-spacing="3.5" filter="url(#subtleGlow)">
        // COGNITIVE ARCHITECT · AGI SYSTEMS OPERATOR
      </text>

      <!-- Primary Name Header -->
      <g class="hero-title">
        <text x="0" y="82" class="hud-text" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
          Jachin Saikia Sonowal
        </text>
        <text x="0" y="82" class="hud-text" font-size="52" font-weight="900" fill="url(#neonCyan)" opacity="0.15" letter-spacing="-1" transform="translate(2, 2)">
          Jachin Saikia Sonowal
        </text>
      </g>

      <!-- Multi-disciplinary Specialization Bar -->
      <text x="0" y="126" class="hud-text" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
        Multi-Agent Swarm Orchestration <tspan fill="#00f2fe">|</tspan> Baremetal RISC-V &amp; Silicon <tspan fill="#a855f7">|</tspan> Autonomous RevOps &amp; Growth
      </text>

      <!-- Terminal Prompt Execution Line -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="760" height="48" rx="8" fill="#030816" stroke="#1e293b" stroke-width="1.2"/>
        <rect x="0" y="0" width="4" height="48" rx="2" fill="url(#neonCyan)"/>
        
        <!-- Prompt glyph -->
        <text x="20" y="30" class="mono-text" font-size="14" font-weight="700" fill="#00f2fe">matrix@jachin:~$</text>
        
        <!-- Command line text -->
        <text x="180" y="30" class="mono-text" font-size="13.5" font-weight="500" fill="#f8fafc">
          promptmatrix swarm --dispatch --nodes=25 --eval=deterministic
        </text>
        
        <!-- Blinking cursor -->
        <rect x="710" y="16" width="9" height="18" fill="#00f2fe" class="status-dot"/>
      </g>

      <!-- Metric Badges Row -->
      <g transform="translate(0, 232)">
        <!-- Badge 1: Production Pipeline -->
        <g>
          <rect x="0" y="0" width="170" height="34" rx="6" fill="#061224" stroke="#0284c7" stroke-width="1"/>
          <text x="14" y="21" class="mono-text" font-size="11" font-weight="700" fill="#38bdf8">REVENUE: $2.5M+</text>
        </g>
        <!-- Badge 2: Open Source Stars & Tools -->
        <g transform="translate(182, 0)">
          <rect x="0" y="0" width="180" height="34" rx="6" fill="#130e29" stroke="#7c3aed" stroke-width="1"/>
          <text x="14" y="21" class="mono-text" font-size="11" font-weight="700" fill="#c084fc">PROMPTMATRIX: OSS</text>
        </g>
        <!-- Badge 3: Silicon & Low-Level -->
        <g transform="translate(374, 0)">
          <rect x="0" y="0" width="180" height="34" rx="6" fill="#071b16" stroke="#059669" stroke-width="1"/>
          <text x="14" y="21" class="mono-text" font-size="11" font-weight="700" fill="#34d399">HARDWARE: RV32I C/ASM</text>
        </g>
        <!-- Badge 4: Production Uptime -->
        <g transform="translate(566, 0)">
          <rect x="0" y="0" width="194" height="34" rx="6" fill="#1f1506" stroke="#d97706" stroke-width="1"/>
          <text x="14" y="21" class="mono-text" font-size="11" font-weight="700" fill="#fbbf24">FIELD UPTIME: 8+ YEARS</text>
        </g>
      </g>
    </g>

    <!-- Laser Scanning Beam Overlay -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" filter="url(#glow)" class="scan-beam"/>

    <!-- High-Tech Viewport Border Frame -->
    <rect x="1" y="1" width="1198" height="418" rx="15" ry="15" fill="none" stroke="url(#neonCyan)" stroke-width="1.2" opacity="0.4"/>
    <!-- Tech Frame Corner Accents -->
    <path d="M 2 30 L 2 2 L 30 2" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <path d="M 1170 2 L 1198 2 L 1198 30" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <path d="M 2 390 L 2 418 L 30 418" fill="none" stroke="#00f2fe" stroke-width="3"/>
    <path d="M 1170 418 L 1198 418 L 1198 390" fill="none" stroke="#00f2fe" stroke-width="3"/>
  </g>
</svg>
