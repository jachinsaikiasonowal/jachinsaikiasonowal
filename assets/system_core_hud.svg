<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <radialGradient id="termBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#060c1c" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#02050e" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#010206" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="termCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="termClip">
      <rect x="0" y="0" width="1100" height="520" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes termCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes scanMatrix {
      0% { transform: translateY(0); }
      100% { transform: translateY(520px); }
    }
    @keyframes glowLine {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    .cursor-blink { animation: termCursor 1.5s ease-in-out infinite; }
    .glow-accent { animation: glowLine 3s ease-in-out infinite; }
  </style>

