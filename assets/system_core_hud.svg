<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <radialGradient id="termBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#070e22" stop-opacity="0.98"/>
      <stop offset="70%" stop-color="#02050e" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#010206" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="termCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
