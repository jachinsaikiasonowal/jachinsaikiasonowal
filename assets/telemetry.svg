<svg fill="none" viewBox="0 0 900 130" width="100%" height="130" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .grid-container {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
        }

        .card {
          background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, rgba(10, 15, 30, 0.95) 100%);
          border: 1px solid rgba(0, 242, 254, 0.2);
          border-radius: 8px;
          padding: 14px 16px;
          position: relative;
          overflow: hidden;
          transition: all 0.3s ease;
        }

        .card::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; height: 2px;
          background: linear-gradient(90deg, #00f2fe, #4facfe);
        }

        .card-label {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.8px;
          color: #94a3b8;
          margin-bottom: 6px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .card-val {
          font-size: 24px;
          font-weight: 800;
          color: #f8fafc;
          letter-spacing: -0.5px;
          margin-bottom: 4px;
        }

        .card-sub {
          font-size: 11px;
          color: #00f2fe;
          font-weight: 500;
        }

        .card-sub.gold { color: #facc15; }
        .card-sub.green { color: #4ade80; }
        .card-sub.purple { color: #c084fc; }

        .progress-track {
          width: 100%;
          height: 3px;
          background: rgba(255, 255, 255, 0.1);
          border-radius: 2px;
          margin-top: 8px;
          overflow: hidden;
        }

        .progress-fill {
          height: 100%;
          border-radius: 2px;
          background: linear-gradient(90deg, #00f2fe, #38bdf8);
          animation: fillUp 2s ease-out forwards;
        }

        .progress-fill.gold { background: linear-gradient(90deg, #eab308, #facc15); width: 85%; }
        .progress-fill.green { background: linear-gradient(90deg, #22c55e, #4ade80); width: 92%; }
        .progress-fill.purple { background: linear-gradient(90deg, #a855f7, #c084fc); width: 78%; }
        .progress-fill.cyan { width: 96%; }

        @keyframes fillUp {
          from { width: 0%; }
        }
      </style>

      <div class="grid-container">
        <div class="card">
          <div class="card-label">Revenue Pipeline <span style="color:#facc15;">●</span></div>
          <div class="card-val">$2.5M+</div>
          <div class="card-sub gold">↑ 3.8x Verified ROAS</div>
          <div class="progress-track"><div class="progress-fill gold"></div></div>
        </div>

        <div class="card">
          <div class="card-label">AI Agent Swarms <span style="color:#4ade80;">●</span></div>
          <div class="card-val">25+ Live</div>
          <div class="card-sub green">87% Latency Slashed</div>
          <div class="progress-track"><div class="progress-fill green"></div></div>
        </div>

        <div class="card">
          <div class="card-label">PromptMatrix Serving <span style="color:#00f2fe;">●</span></div>
          <div class="card-val">&lt;5ms</div>
          <div class="card-sub cyan">Sub-5ms Hot-Patching</div>
          <div class="progress-track"><div class="progress-fill cyan"></div></div>
        </div>

        <div class="card">
          <div class="card-label">Client Systems <span style="color:#c084fc;">●</span></div>
          <div class="card-val">175+</div>
          <div class="card-sub purple">SaaS / Enterprise Ops</div>
          <div class="progress-track"><div class="progress-fill purple"></div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>