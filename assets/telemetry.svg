<svg fill="none" viewBox="0 0 900 135" width="100%" height="135" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .telemetry-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 12px;
          font-family: 'Space Grotesk', -apple-system, sans-serif;
        }

        .hud-card {
          position: relative;
          background: linear-gradient(180deg, rgba(13, 22, 41, 0.85) 0%, rgba(6, 11, 25, 0.95) 100%);
          border: 1px solid rgba(0, 242, 254, 0.25);
          border-radius: 10px;
          padding: 14px 16px;
          overflow: hidden;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 242, 254, 0.03);
          transition: border-color 0.3s ease;
        }

        .hud-card::before {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(90deg, #00f2fe, #a855f7);
        }

        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 6px;
        }

        .card-label {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10.5px;
          text-transform: uppercase;
          letter-spacing: 0.9px;
          color: #94a3b8;
          font-weight: 700;
        }

        .card-indicator {
          width: 6px;
          height: 6px;
          border-radius: 50%;
          box-shadow: 0 0 8px currentColor;
        }

        .card-val {
          font-size: 25px;
          font-weight: 800;
          color: #f8fafc;
          letter-spacing: -0.5px;
          line-height: 1.1;
          margin-bottom: 4px;
        }

        .card-sub {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 600;
          display: flex;
          align-items: center;
          gap: 4px;
        }

        .color-gold { color: #facc15; }
        .color-green { color: #4ade80; }
        .color-cyan { color: #00f2fe; }
        .color-purple { color: #c084fc; }

        .progress-track {
          position: relative;
          width: 100%;
          height: 4px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 2px;
          margin-top: 8px;
          overflow: hidden;
        }

        .progress-bar {
          height: 100%;
          border-radius: 2px;
          position: relative;
        }

        .bar-gold {
          width: 88%;
          background: linear-gradient(90deg, #ca8a04, #facc15);
          box-shadow: 0 0 8px rgba(250, 204, 21, 0.6);
        }

        .bar-green {
          width: 94%;
          background: linear-gradient(90deg, #16a34a, #4ade80);
          box-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
        }

        .bar-cyan {
          width: 98%;
          background: linear-gradient(90deg, #0284c7, #00f2fe);
          box-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
        }

        .bar-purple {
          width: 82%;
          background: linear-gradient(90deg, #7c3aed, #c084fc);
          box-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
        }
      </style>

      <div class="telemetry-grid">
        <!-- Metric 1 -->
        <div class="hud-card">
          <div class="card-header">
            <span class="card-label">Revenue Pipeline</span>
            <span class="card-indicator color-gold" style="background:#facc15;"></span>
          </div>
          <div class="card-val">$2.5M+</div>
          <div class="card-sub color-gold">↑ 3.8x Verified ROAS</div>
          <div class="progress-track"><div class="progress-bar bar-gold"></div></div>
        </div>

        <!-- Metric 2 -->
        <div class="hud-card">
          <div class="card-header">
            <span class="card-label">AI Swarms Live</span>
            <span class="card-indicator color-green" style="background:#4ade80;"></span>
          </div>
          <div class="card-val">25+ Prod</div>
          <div class="card-sub color-green">&lt;90s Signal-to-Action</div>
          <div class="progress-track"><div class="progress-bar bar-green"></div></div>
        </div>

        <!-- Metric 3 -->
        <div class="hud-card">
          <div class="card-header">
            <span class="card-label">PromptMatrix Latency</span>
            <span class="card-indicator color-cyan" style="background:#00f2fe;"></span>
          </div>
          <div class="card-val">&lt;5ms</div>
          <div class="card-sub color-cyan">Sub-5ms Hot-Patching</div>
          <div class="progress-track"><div class="progress-bar bar-cyan"></div></div>
        </div>

        <!-- Metric 4 -->
        <div class="hud-card">
          <div class="card-header">
            <span class="card-label">Client Systems</span>
            <span class="card-indicator color-purple" style="background:#c084fc;"></span>
          </div>
          <div class="card-val">175+</div>
          <div class="card-sub color-purple">Enterprise &amp; SaaS Ops</div>
          <div class="progress-track"><div class="progress-bar bar-purple"></div></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>