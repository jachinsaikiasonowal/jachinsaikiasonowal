<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="100%" height="100%">
  <defs>
    <radialGradient id="hudGradBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08142b" stop-opacity="0.98"/>
      <stop offset="60%" stop-color="#020614" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="#010208" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="hudWindowClip">
      <rect x="0" y="0" width="1100" height="420" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes spinChipOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes counterChipOrbit {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCoreNode {
      0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 6px rgba(0,242,254,0.5)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(0,242,254,0.9)); }
    }
    @keyframes hudBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, Roboto, sans-serif; }
    
    .chip-ring-1 { transform-origin: 155px 230px; animation: spinChipOrbit 14s linear infinite; }
    .chip-ring-2 { transform-origin: 155px 230px; animation: counterChipOrbit 9s linear infinite; }
    .chip-core-pulse { animation: pulseCoreNode 3s ease-in-out infinite; }
    .cursor-flash { animation: hudBlink 1.4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#hudWindowClip)">
    <rect width="1100" height="420" fill="url(#hudGradBg)"/>

    <!-- Terminal Window Top Bar -->
    <rect x="0" y="0" width="1100" height="40" fill="#0b162c" stroke="#1e293b" stroke-width="1"/>
    
    <!-- macOS Window Buttons -->
    <circle cx="24" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="20" r="6" fill="#10b981"/>

    <!-- Window Title -->
    <text x="550" y="25" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">
      ⚡ jachin@matrix-control:~ (RV32I · PROMPTMATRIX · SYSTEM KERNEL)
    </text>

    <!-- Pane Splitter Line -->
    <line x1="310" y1="40" x2="310" y2="420" stroke="#1e293b" stroke-width="1.2"/>

    <!-- ==================== LEFT PANE: HOLOGRAPHIC SILICON CHIP ==================== -->
    <g transform="translate(20, 58)">
      <rect width="270" height="340" rx="8" fill="#030814" stroke="#0284c7" stroke-width="1" opacity="0.85"/>
      
      <!-- Top Chip Header -->
      <rect x="0" y="0" width="270" height="30" rx="8" fill="#0c233c"/>
      <text x="135" y="20" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1">
        NEURAL SILICON MATRIX
      </text>

      <!-- Center Holographic Orb -->
      <g transform="translate(-20, -58)">
        <!-- Outer Hexagon -->
        <polygon points="155,160 215,195 215,265 155,300 95,265 95,195" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.3" stroke-dasharray="4 4"/>
        
        <!-- Rotating Ring 1 -->
        <g class="chip-ring-1">
          <circle cx="155" cy="230" r="58" fill="none" stroke="url(#neonCyan)" stroke-width="1.6" stroke-dasharray="90 30 20 15" opacity="0.8"/>
          <circle cx="155" cy="172" r="3.5" fill="#00f2fe" filter="url(#coreGlow)"/>
        </g>
        
        <!-- Rotating Ring 2 -->
        <g class="chip-ring-2">
          <circle cx="155" cy="230" r="42" fill="none" stroke="url(#neonPurple)" stroke-width="1.4" stroke-dasharray="50 20 15 10" opacity="0.85"/>
          <circle cx="155" cy="188" r="3" fill="#c084fc" filter="url(#coreGlow)"/>
        </g>

        <!-- Center Core Micro-Die -->
        <rect x="137" y="212" width="36" height="36" rx="4" fill="#061226" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="155" y="235" text-anchor="middle" font-size="11" font-weight="800" fill="#00f2fe" class="mono chip-core-pulse">⬡</text>
      </g>

      <!-- Bottom Architecture Status -->
      <g transform="translate(14, 250)">
        <rect width="242" height="24" rx="4" fill="#081e36" stroke="#00f2fe" stroke-width="0.8"/>
        <text x="121" y="16" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1">
          ISA: RV32I · AGI SWARMS
        </text>

        <rect x="0" y="32" width="242" height="24" rx="4" fill="#0b1329" stroke="#334155" stroke-width="0.8"/>
        <text x="121" y="48" text-anchor="middle" class="mono" font-size="9" fill="#94a3b8">
          STATUS: 100% OPERATIONAL
        </text>
      </g>
    </g>

    <!-- ==================== RIGHT PANE: KERNEL & SYSTEM SPECIFICATIONS ==================== -->
    <g transform="translate(335, 58)">
      <!-- Command prompt -->
      <text x="0" y="18" class="mono" font-size="13" font-weight="700" fill="#38bdf8">
        jachin@matrix-control <tspan fill="#64748b">---------------------------------------------------</tspan>
      </text>

      <!-- Structured System Specifications -->
      <g transform="translate(0, 36)" class="mono" font-size="11.5">
        <!-- 1. OS -->
        <text x="0" y="14" fill="#00f2fe" font-weight="700">. OS Environment:</text>
        <text x="180" y="14" fill="#f8fafc">Debian / Ubuntu Linux · Windows 11 (WSL2) · Vercel Edge</text>

        <!-- 2. Host -->
        <text x="0" y="38" fill="#00f2fe" font-weight="700">. Host Base:</text>
        <text x="180" y="38" fill="#f8fafc">Matrix Labs // Guwahati, Assam (Global Remote)</text>

        <!-- 3. Kernel -->
        <text x="0" y="62" fill="#00f2fe" font-weight="700">. Kernel Profile:</text>
        <text x="180" y="62" fill="#34d399" font-weight="600">Cognitive Architect &amp; AGI Swarms Lead</text>

        <!-- 4. Uptime -->
        <text x="0" y="86" fill="#00f2fe" font-weight="700">. Production Uptime:</text>
        <text x="180" y="86" fill="#fbbf24">8+ Years Production (Revenue &amp; Systems Architecture)</text>

        <!-- 5. Toolchains -->
        <text x="0" y="110" fill="#00f2fe" font-weight="700">. Core Toolchains:</text>
        <text x="180" y="110" fill="#cbd5e1">GCC, Make, GDB, Node 22, Python 3.12, Cursor, Claude Code, n8n</text>

        <!-- Divider -->
        <text x="0" y="136" fill="#334155">- Architecture &amp; Computing Stack ----------------------------------</text>

        <!-- 6. Languages High -->
        <text x="0" y="160" fill="#c084fc" font-weight="700">. Languages.High:</text>
        <text x="180" y="160" fill="#f8fafc">Python, TypeScript, JavaScript (ES6+), SQL</text>

        <!-- 7. Languages Low -->
        <text x="0" y="184" fill="#c084fc" font-weight="700">. Languages.Low:</text>
        <text x="180" y="184" fill="#f8fafc">Pure C (C99), RISC-V RV32I Assembly, POSIX IPC, Bash</text>

        <!-- 8. AI Engines -->
        <text x="0" y="208" fill="#c084fc" font-weight="700">. Intelligence Engines:</text>
        <text x="180" y="208" fill="#f8fafc">PROMPTMATRIX, Claude 3.7 Sonnet, Gemini 2.5 Pro, GPT-4o</text>

        <!-- Divider -->
        <text x="0" y="234" fill="#334155">- Core Specializations --------------------------------------------</text>

        <!-- 9. Spec 1 -->
        <text x="0" y="258" fill="#34d399" font-weight="700">. AGI Control Plane:</text>
        <text x="180" y="258" fill="#f8fafc">Sub-5ms Dynamic Prompt Registry &amp; Swarm Hot-Patching</text>

        <!-- 10. Spec 2 -->
        <text x="0" y="282" fill="#34d399" font-weight="700">. Silicon Computing:</text>
        <text x="180" y="282" fill="#f8fafc">5-Stage CPU Pipeline Simulator, Memory Lab Allocators</text>

        <!-- 11. Spec 3 -->
        <text x="0" y="306" fill="#34d399" font-weight="700">. Autonomous RevOps:</text>
        <text x="180" y="306" fill="#f8fafc">25+ Production AI Swarms, $2.5M+ Pipeline Generated</text>
      </g>

      <!-- Shell Cursor -->
      <rect x="670" y="348" width="9" height="16" fill="#00f2fe" class="cursor-flash"/>
    </g>

    <!-- Outer Frame -->
    <rect x="1" y="1" width="1098" height="418" rx="11" ry="11" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
  </g>
</svg>
