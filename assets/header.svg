<svg fill="none" viewBox="0 0 900 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700;900&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .header-box {
          position: relative;
          width: 100%;
          height: 228px;
          background: radial-gradient(circle at 80% 20%, rgba(0, 242, 254, 0.12) 0%, transparent 50%),
                      radial-gradient(circle at 10% 80%, rgba(138, 43, 226, 0.12) 0%, transparent 50%),
                      linear-gradient(135deg, #030712 0%, #070d1e 45%, #050814 100%);
          border: 1px solid rgba(0, 242, 254, 0.35);
          border-radius: 14px;
          padding: 24px 32px;
          font-family: 'Space Grotesk', -apple-system, sans-serif;
          overflow: hidden;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(0, 242, 254, 0.08);
        }

        .cyber-grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 242, 254, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
          background-size: 24px 24px;
          pointer-events: none;
        }

        .scanline-beam {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(90deg, transparent 0%, rgba(0, 242, 254, 0.8) 50%, #a855f7 80%, transparent 100%);
          box-shadow: 0 0 15px rgba(0, 242, 254, 0.9);
          animation: scanVertical 4.5s ease-in-out infinite;
        }

        @keyframes scanVertical {
          0% { transform: translateY(-5px); opacity: 0; }
          15% { opacity: 1; }
          85% { opacity: 1; }
          100% { transform: translateY(230px); opacity: 0; }
        }

        .radar-corner {
          position: absolute;
          right: 28px;
          top: 24px;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 1px dashed rgba(0, 242, 254, 0.35);
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .radar-sweep {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border-top: 2px solid #00f2fe;
          animation: radarRotate 3s linear infinite;
        }

        @keyframes radarRotate {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }

        .hud-status-bar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 12px;
        }

        .status-badge {
          display: inline-flex;
          align-items: center;
          gap: 9px;
          background: rgba(0, 242, 254, 0.08);
          border: 1px solid rgba(0, 242, 254, 0.4);
          border-radius: 20px;
          padding: 4px 14px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          color: #00f2fe;
          letter-spacing: 1.2px;
          text-transform: uppercase;
        }

        .live-dot {
          width: 7px;
          height: 7px;
          background: #00f2fe;
          border-radius: 50%;
          box-shadow: 0 0 10px #00f2fe, 0 0 20px #00f2fe;
          animation: pulseGlow 1.8s infinite ease-in-out;
        }

        @keyframes pulseGlow {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.35; transform: scale(0.8); }
        }

        .sys-telemetry {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          color: #64748b;
          letter-spacing: 0.8px;
          margin-right: 56px;
        }

        .name-glitch {
          font-size: 28px;
          font-weight: 900;
          letter-spacing: -0.5px;
          background: linear-gradient(90deg, #ffffff 0%, #38bdf8 40%, #00f2fe 70%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 6px;
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .name-suffix {
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          font-weight: 600;
          color: #38bdf8;
          background: rgba(56, 189, 248, 0.12);
          padding: 2px 8px;
          border-radius: 4px;
          border: 1px solid rgba(56, 189, 248, 0.3);
          -webkit-text-fill-color: #38bdf8;
        }

        .sub-tagline {
          font-size: 13.5px;
          font-weight: 500;
          color: #94a3b8;
          margin-bottom: 18px;
          letter-spacing: 0.3px;
        }

        .sub-tagline b {
          color: #e2e8f0;
          font-weight: 700;
        }

        .capsule-cluster {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .capsule {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 600;
          padding: 4px 10px;
          border-radius: 6px;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #cbd5e1;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .capsule.cyan {
          background: rgba(0, 242, 254, 0.08);
          border-color: rgba(0, 242, 254, 0.4);
          color: #38bdf8;
        }

        .capsule.gold {
          background: rgba(250, 204, 21, 0.08);
          border-color: rgba(250, 204, 21, 0.4);
          color: #facc15;
        }

        .capsule.purple {
          background: rgba(168, 85, 247, 0.08);
          border-color: rgba(168, 85, 247, 0.4);
          color: #c084fc;
        }
      </style>

      <div class="header-box">
        <div class="cyber-grid"></div>
        <div class="scanline-beam"></div>

        <div class="radar-corner">
          <div class="radar-sweep"></div>
          <span style="font-size: 9px; color: #00f2fe; font-family: 'JetBrains Mono', monospace;">99.9%</span>
        </div>

        <div class="hud-status-bar">
          <div class="status-badge">
            <span class="live-dot"></span>
            SWARM RUNTIME ACTIVE // AGENTIC OS
          </div>
          <div class="sys-telemetry">LOC: 26.14° N, 91.73° E // GUWAHATI · IN</div>
        </div>

        <div class="name-glitch">
          JACHIN SAIKIA SONOWAL
          <span class="name-suffix">ARCHITECT v4.8</span>
        </div>

        <div class="sub-tagline">
          Growth Systems Architect ⚡ <b>AI RevOps &amp; Autonomous Swarms</b> ⚡ Creator of <b>PROMPTMATRIX</b>
        </div>

        <div class="capsule-cluster">
          <div class="capsule cyan">⚡ &lt;5ms Prompt Serving</div>
          <div class="capsule gold">📈 $2.5M+ Pipeline Generated</div>
          <div class="capsule purple">🤖 25+ Production AI Swarms</div>
          <div class="capsule cyan">🔬 Baremetal RISC-V</div>
          <div class="capsule">🌐 175+ Client Architectures</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>