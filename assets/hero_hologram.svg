<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0c1a36" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#030712" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#010309" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="cyanLaser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purpleLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="heroClip">
      <rect x="0" y="0" width="1200" height="250" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(-250px); opacity: 0; }
      50% { opacity: 0.75; }
      100% { transform: translateY(250px); opacity: 0; }
    }
    @keyframes pulseHolo {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.4)); }
      50% { opacity: 0.95; filter: drop-shadow(0 0 18px rgba(0, 242, 254, 0.9)); }
    }
    @keyframes orbit1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbit2 {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes liveBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes circuitStream {
      0% { stroke-dashoffset: 300; }
      100% { stroke-dashoffset: 0; }
    }

    .sans-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono-font { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    
    .scan-beam { animation: laserSweep 6s ease-in-out infinite; }
    .core-pulse { animation: pulseHolo 3s ease-in-out infinite; }
    .radar-outer { transform-origin: 1060px 125px; animation: orbit1 14s linear infinite; }
    .radar-inner { transform-origin: 1060px 125px; animation: orbit2 9s linear infinite; }
    .blink-dot { animation: liveBlink 1.8s ease-in-out infinite; }
    .circuit-bus { stroke-dasharray: 8 12; animation: circuitStream 12s linear infinite; }
  </style>

  <g clip-path="url(#heroClip)">
    <rect width="1200" height="250" fill="url(#heroBg)"/>

    <!-- Grid -->
    <g stroke="url(#gridFade)" stroke-width="1" opacity="0.6">
      <line x1="0" y1="50" x2="1200" y2="50"/>
      <line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="160" y1="0" x2="160" y2="250"/>
      <line x1="400" y1="0" x2="400" y2="250"/>
      <line x1="640" y1="0" x2="640" y2="250"/>
      <line x1="880" y1="0" x2="880" y2="250"/>
    </g>

    <!-- Circuit Conduit Lines -->
    <g fill="none" stroke="#00f2fe" stroke-width="1.3" opacity="0.4">
      <path d="M 0 60 L 320 60 L 360 100 L 780 100 L 820 60 L 1200 60" class="circuit-bus"/>
      <path d="M 0 200 L 260 200 L 300 160 L 680 160 L 720 200 L 1200 200" class="circuit-bus" stroke="#a855f7"/>
    </g>

    <!-- Radar HUD (Right Side) -->
    <g id="radar-hud">
      <polygon points="1060,45 1130,85 1130,165 1060,205 990,165 990,85" fill="#020814" stroke="#00f2fe" stroke-width="1" opacity="0.35" stroke-dasharray="4 4"/>
      
      <g class="radar-outer">
        <circle cx="1060" cy="125" r="64" fill="none" stroke="url(#cyanLaser)" stroke-width="1.5" stroke-dasharray="110 30 20 15" opacity="0.8"/>
        <circle cx="1060" cy="61" r="3.5" fill="#00f2fe" filter="url(#bloom)"/>
      </g>
      
      <g class="radar-inner">
        <circle cx="1060" cy="125" r="44" fill="none" stroke="url(#purpleLaser)" stroke-width="1.2" stroke-dasharray="60 20 15 10" opacity="0.85"/>
        <circle cx="1060" cy="81" r="3" fill="#c084fc" filter="url(#bloom)"/>
      </g>
      
      <circle cx="1060" cy="125" r="24" fill="#040d1f" stroke="#00f2fe" stroke-width="1.3" opacity="0.95"/>
      <circle cx="1060" cy="125" r="8" fill="url(#cyanLaser)" filter="url(#bloom)" class="core-pulse"/>
      <circle cx="1060" cy="125" r="3" fill="#ffffff"/>

      <line x1="970" y1="125" x2="1150" y2="125" stroke="#00f2fe" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3"/>
      <line x1="1060" y1="35" x2="1060" y2="215" stroke="#00f2fe" stroke-width="0.6" opacity="0.3" stroke-dasharray="3 3"/>

      <rect x="980" y="218" width="160" height="20" rx="4" fill="#051226" stroke="#00f2fe" stroke-width="0.8" opacity="0.8"/>
      <text x="1060" y="232" text-anchor="middle" class="mono-font" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">
        25 PROD SWARM NODES
      </text>
    </g>

    <!-- Top Status Bar -->
    <g id="top-status">
      <rect x="50" y="30" width="170" height="24" rx="12" fill="#051624" stroke="#00f2fe" stroke-width="1" opacity="0.95"/>
      <circle cx="65" cy="42" r="3.5" fill="#10b981" class="blink-dot" filter="url(#bloom)"/>
      <text x="78" y="46" class="mono-font" font-size="10" font-weight="700" fill="#34d399" letter-spacing="1">SYSTEM: OPERATIONAL</text>

      <rect x="235" y="30" width="180" height="24" rx="12" fill="#100b29" stroke="#818cf8" stroke-width="1" opacity="0.95"/>
      <text x="250" y="46" class="mono-font" font-size="10" font-weight="700" fill="#c7d2fe" letter-spacing="1">PROMPTMATRIX // v1.2</text>

      <text x="910" y="46" text-anchor="end" class="mono-font" font-size="9.5" fill="#64748b" letter-spacing="1.5">
        CORE: RV32I · AGI SWARMS · REVOPS
      </text>
    </g>

    <!-- Central Role & Architectural Manifesto -->
    <g transform="translate(50, 78)">
      <!-- Main Role Title -->
      <text x="0" y="28" class="sans-font" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
        Cognitive Architect <tspan fill="#00f2fe">&amp;</tspan> AGI Systems Operator
      </text>

      <!-- Subtitle -->
      <text x="0" y="60" class="sans-font" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
        Multi-Agent Swarm Control Planes <tspan fill="#00f2fe">|</tspan> Baremetal RISC-V &amp; Silicon <tspan fill="#a855f7">|</tspan> Autonomous RevOps Infrastructure
      </text>

      <!-- Terminal Command Line -->
      <g transform="translate(0, 82)">
        <rect x="0" y="0" width="760" height="42" rx="6" fill="#030919" stroke="#1e293b" stroke-width="1.1"/>
        <rect x="0" y="0" width="3.5" height="42" rx="1.5" fill="url(#cyanLaser)"/>
        
        <text x="18" y="26" class="mono-font" font-size="12.5" font-weight="700" fill="#00f2fe">matrix@node:~$</text>
        <text x="156" y="26" class="mono-font" font-size="12" font-weight="500" fill="#f8fafc">
          promptmatrix swarm --dispatch --nodes=25 --eval=deterministic --latency=&lt;5ms
        </text>
        <rect x="710" y="13" width="7" height="15" fill="#00f2fe" class="blink-dot"/>
      </g>
    </g>

    <!-- Laser Scanning Beam -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#cyanLaser)" stroke-width="1.8" opacity="0.6" filter="url(#bloom)" class="scan-beam"/>

    <!-- Outer Frame -->
    <rect x="1" y="1" width="1198" height="248" rx="13" ry="13" fill="none" stroke="url(#cyanLaser)" stroke-width="1.1" opacity="0.35"/>
    <path d="M 2 22 L 2 2 L 22 2" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <path d="M 1178 2 L 1198 2 L 1198 22" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <path d="M 2 228 L 2 248 L 22 248" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <path d="M 1178 248 L 1198 248 L 1198 228" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
  </g>
</svg>
