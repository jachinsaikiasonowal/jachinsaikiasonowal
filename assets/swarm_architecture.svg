<svg fill="none" viewBox="0 0 900 185" width="100%" height="185" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=Space+Grotesk:wght@600;700;800&amp;display=swap');

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .swarm-container {
          width: 100%;
          height: 183px;
          background: linear-gradient(135deg, #050914 0%, #0a1128 50%, #030611 100%);
          border: 1px solid rgba(0, 242, 254, 0.3);
          border-radius: 12px;
          padding: 16px 20px;
          font-family: 'Space Grotesk', -apple-system, sans-serif;
          position: relative;
          overflow: hidden;
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
        }

        .title-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 14px;
        }

        .arch-title {
          font-size: 13px;
          font-weight: 800;
          letter-spacing: 0.8px;
          color: #38bdf8;
          text-transform: uppercase;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .arch-sub {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10.5px;
          color: #64748b;
        }

        .nodes-grid {
          display: grid;
          grid-template-columns: 1.2fr 40px 1.5fr 40px 1.3fr;
          align-items: center;
          gap: 6px;
        }

        .node-box {
          background: rgba(15, 23, 42, 0.85);
          border: 1px solid rgba(255, 255, 255, 0.1);
          border-radius: 8px;
          padding: 10px 12px;
          transition: all 0.3s;
        }

        .node-box.primary {
          border-color: rgba(0, 242, 254, 0.5);
          background: radial-gradient(circle at top left, rgba(0, 242, 254, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
        }

        .node-box.swarm {
          border-color: rgba(168, 85, 247, 0.5);
          background: radial-gradient(circle at top left, rgba(168, 85, 247, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
        }

        .node-box.output {
          border-color: rgba(34, 197, 94, 0.5);
          background: radial-gradient(circle at top left, rgba(34, 197, 94, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
        }

        .node-header {
          font-family: 'JetBrains Mono', monospace;
          font-size: 11px;
          font-weight: 700;
          margin-bottom: 4px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .node-desc {
          font-size: 10.5px;
          color: #94a3b8;
          line-height: 1.3;
        }

        .arrow-box {
          display: flex;
          align-items: center;
          justify-content: center;
          color: #00f2fe;
          font-size: 18px;
          animation: pulseArrow 1.5s infinite ease-in-out;
        }

        @keyframes pulseArrow {
          0%, 100% { transform: translateX(0); opacity: 0.5; }
          50% { transform: translateX(3px); opacity: 1; color: #38bdf8; }
        }

        .pulse-tag {
          font-size: 9px;
          padding: 1px 5px;
          border-radius: 4px;
          font-weight: 700;
        }

        .pulse-cyan { background: rgba(0, 242, 254, 0.2); color: #00f2fe; }
        .pulse-purple { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .pulse-green { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
      </style>

      <div class="swarm-container">
        <div class="title-row">
          <div class="arch-title">
            <span>⬡</span> PROMPTMATRIX × AGENT SWARM CONTROL PLANE
          </div>
          <div class="arch-sub">ZERO-RESTART HOT-PATCHING // EVALUATION PIPELINE</div>
        </div>

        <div class="nodes-grid">
          <!-- Column 1: Signal Ingestion -->
          <div class="node-box primary">
            <div class="node-header" style="color: #00f2fe;">
              SIGNAL INGESTION
              <span class="pulse-tag pulse-cyan">&lt;90s</span>
            </div>
            <div class="node-desc">
              Intent webhook stream · 6sense · HubSpot · n8n webhook triggers
            </div>
          </div>

          <!-- Arrow 1 -->
          <div class="arrow-box">➔</div>

          <!-- Column 2: PromptMatrix Engine -->
          <div class="node-box swarm">
            <div class="node-header" style="color: #c084fc;">
              PROMPTMATRIX PLANE
              <span class="pulse-tag pulse-purple">&lt;5ms</span>
            </div>
            <div class="node-desc">
              Dynamic system prompt injection · LLM-as-a-judge score guard · Drift containment
            </div>
          </div>

          <!-- Arrow 2 -->
          <div class="arrow-box" style="color:#c084fc;">➔</div>

          <!-- Column 3: Autonomous Actions -->
          <div class="node-box output">
            <div class="node-header" style="color: #4ade80;">
              REVENUE EXECUTION
              <span class="pulse-tag pulse-green">3.8x ROAS</span>
            </div>
            <div class="node-desc">
              Lead enrichment · Multi-channel SDR dispatch · Deterministic CRM sync
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
