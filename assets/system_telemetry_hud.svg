<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <radialGradient id="hudBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071226" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#020612" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#010207" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="hudClip">
      <rect x="0" y="0" width="1100" height="280" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes waveOscillate {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 320; }
    }
    @keyframes barPulse {
      0%, 100% { width: 85%; }
      50% { width: 98%; }
    }
    @keyframes barPulse2 {
      0%, 100% { width: 92%; }
      50% { width: 78%; }
    }
    @keyframes barPulse3 {
      0%, 100% { width: 96%; }
      50% { width: 100%; }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, Roboto, sans-serif; }
    .wave-line { stroke-dasharray: 12 6; animation: waveOscillate 8s linear infinite; }
    .radar-sweep { transform-origin: 90px 140px; animation: radarSpin 6s linear infinite; }
    .blink { animation: blinkDot 1.6s ease-in-out infinite; }
    .bar-1 { animation: barPulse 5s ease-in-out infinite; }
    .bar-2 { animation: barPulse2 6s ease-in-out infinite; }
    .bar-3 { animation: barPulse3 4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#hudClip)">
    <rect width="1100" height="280" fill="url(#hudBg)"/>

    <!-- Perimeter Tech Grid -->
    <g stroke="#1e293b" stroke-width="0.7" opacity="0.4">
      <line x1="180" y1="0" x2="180" y2="280"/>
      <line x1="490" y1="0" x2="490" y2="280"/>
      <line x1="790" y1="0" x2="790" y2="280"/>
      <line x1="0" y1="50" x2="1100" y2="50"/>
      <line x1="0" y1="230" x2="1100" y2="230"/>
    </g>

    <!-- Top Telemetry Stream Title -->
    <g transform="translate(30, 32)">
      <circle cx="8" cy="8" r="4" fill="#00f2fe" class="blink" filter="url(#hudGlow)"/>
      <text x="22" y="12" class="mono" font-size="11" font-weight="700" fill="#00f2fe" letter-spacing="2">
        LIVE SYSTEM TELEMETRY // REAL-TIME RUNTIME KERNEL
      </text>
      <text x="1040" y="12" text-anchor="end" class="mono" font-size="10" fill="#64748b" letter-spacing="1">
        POLL FREQUENCY: 1000Hz · ZERO ALLOC
      </text>
    </g>

    <!-- ==================== MODULE 1: RADAR OSCILLOSCOPE (LEFT) ==================== -->
    <g transform="translate(10, 20)">
      <!-- Outer Dial -->
      <circle cx="90" cy="140" r="64" fill="#030a17" stroke="#00f2fe" stroke-width="1.2" opacity="0.8"/>
      <circle cx="90" cy="140" r="44" fill="none" stroke="#1e3a5f" stroke-width="0.8" stroke-dasharray="4 4"/>
      <circle cx="90" cy="140" r="22" fill="none" stroke="#1e3a5f" stroke-width="0.8"/>
      <!-- Crosshairs -->
      <line x1="26" y1="140" x2="154" y2="140" stroke="#00f2fe" stroke-width="0.6" opacity="0.4"/>
      <line x1="90" y1="76" x2="90" y2="204" stroke="#00f2fe" stroke-width="0.6" opacity="0.4"/>
      <!-- Radar Sweeper -->
      <g class="radar-sweep">
        <line x1="90" y1="140" x2="90" y2="76" stroke="#00f2fe" stroke-width="2" filter="url(#hudGlow)"/>
        <polygon points="90,140 90,76 130,100" fill="#00f2fe" opacity="0.12"/>
      </g>
      <circle cx="90" cy="140" r="4" fill="#00f2fe"/>
      <text x="90" y="222" text-anchor="middle" class="mono" font-size="9" fill="#38bdf8" letter-spacing="1">SWARM RADAR</text>
    </g>

    <!-- ==================== MODULE 2: LATENCY & PROMPT SERVING METRICS ==================== -->
    <g transform="translate(200, 75)">
      <text x="0" y="0" class="mono" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">PROMPT SERVING VELOCITY</text>
      <text x="0" y="34" class="sans" font-size="32" font-weight="900" fill="#00f2fe">&lt;4.8 ms</text>
      <text x="145" y="24" class="mono" font-size="10" font-weight="600" fill="#34d399">P99 LATENCY</text>
      
      <!-- Live Oscilloscope Waveform -->
      <g transform="translate(0, 52)">
        <path d="M 0 20 Q 30 0 60 20 T 120 20 T 180 20 T 240 20" fill="none" stroke="url(#cyanLine)" stroke-width="2" class="wave-line" filter="url(#hudGlow)"/>
        <text x="0" y="44" class="mono" font-size="9.5" fill="#64748b">In-memory zero-copy cache · AES-256 GCM</text>
      </g>
    </g>

    <!-- ==================== MODULE 3: PRODUCTION REVENUE & PIPELINE ==================== -->
    <g transform="translate(510, 75)">
      <text x="0" y="0" class="mono" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">REVENUE VELOCITY IMPACT</text>
      <text x="0" y="34" class="sans" font-size="32" font-weight="900" fill="#c084fc">$2.5M+</text>
      <text x="135" y="24" class="mono" font-size="10" font-weight="600" fill="#a855f7">PIPELINE GEN</text>

      <!-- Meter 1 -->
      <g transform="translate(0, 52)">
        <text x="0" y="10" class="mono" font-size="9.5" fill="#cbd5e1">SDR Swarm Qualified Lead Rate</text>
        <rect x="0" y="18" width="250" height="8" rx="4" fill="#1e1b4b"/>
        <rect x="0" y="18" width="220" height="8" rx="4" fill="url(#purpleLine)" class="bar-1"/>
        <text x="0" y="44" class="mono" font-size="9.5" fill="#64748b">3.8x Aggregate ROAS across 175+ accounts</text>
      </g>
    </g>

    <!-- ==================== MODULE 4: COMPUTING & SILICON KERNEL ==================== -->
    <g transform="translate(810, 75)">
      <text x="0" y="0" class="mono" font-size="10.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">HARDWARE &amp; ARCH INTEGRITY</text>
      <text x="0" y="34" class="sans" font-size="32" font-weight="900" fill="#34d399">RV32I</text>
      <text x="110" y="24" class="mono" font-size="10" font-weight="600" fill="#10b981">BARE-METAL</text>

      <!-- Meter 2 -->
      <g transform="translate(0, 52)">
        <text x="0" y="10" class="mono" font-size="9.5" fill="#cbd5e1">5-Stage Hazard Detection &amp; Sim</text>
        <rect x="0" y="18" width="250" height="8" rx="4" fill="#064e3b"/>
        <rect x="0" y="18" width="240" height="8" rx="4" fill="url(#emeraldLine)" class="bar-3"/>
        <text x="0" y="44" class="mono" font-size="9.5" fill="#64748b">Static bump alloc · Zero leaks · C99 / ASM</text>
      </g>
    </g>

    <!-- Bottom Status Strip -->
    <g transform="translate(30, 255)">
      <text x="0" y="0" class="mono" font-size="9.5" fill="#64748b">
        [CPU: NOMINAL] · [RAM BUMP: 0 FRAG] · [SWARM HEALTH: 100%] · [ENCRYPTION: HARDENED] · [NODE: GUWAHATI / REMOTE]
      </text>
    </g>
  </g>
</svg>
