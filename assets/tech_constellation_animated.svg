<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <radialGradient id="stackBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1120" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#030712" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#010206" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="podCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="podPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="podEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="podAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="podGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="stackClip">
      <rect x="0" y="0" width="1100" height="380" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <style>
    @keyframes orbitPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.7)); }
    }
    @keyframes tagHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: 'SF Pro Display', -apple-system, Roboto, sans-serif; }
    .pulse-hud { animation: orbitPulse 3s ease-in-out infinite; }
    .tag-anim { animation: tagHover 4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#stackClip)">
    <rect width="1100" height="380" fill="url(#stackBg)"/>

    <!-- Tech Grid Background -->
    <g stroke="#1e293b" stroke-width="0.7" opacity="0.4">
      <line x1="0" y1="60" x2="1100" y2="60"/>
      <line x1="550" y1="0" x2="550" y2="380"/>
      <line x1="0" y1="220" x2="1100" y2="220"/>
    </g>

    <!-- Header -->
    <g transform="translate(40, 36)">
      <circle cx="8" cy="8" r="4" fill="#00f2fe" class="pulse-hud" filter="url(#podGlow)"/>
      <text x="24" y="12" class="mono" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="2">
        ENGINEERING ARSENAL // MULTI-DOMAIN SPECIALIZATION MATRIX
      </text>
      <text x="1020" y="12" text-anchor="end" class="mono" font-size="10.5" fill="#64748b" letter-spacing="1">
        4 CORE VERTICALS · 100% PRODUCTION HARDENED
      </text>
    </g>

    <!-- ==================== QUADRANT 1: AGI & SWARM INTELLIGENCE (TOP LEFT) ==================== -->
    <g transform="translate(40, 80)">
      <rect width="490" height="125" rx="8" fill="#080e21" stroke="#00f2fe" stroke-width="1.2"/>
      <!-- Header Strip -->
      <path d="M 0 8 Q 0 0 8 0 L 482 0 Q 490 0 490 8 L 490 28 L 0 28 Z" fill="#0c233c"/>
      <text x="14" y="19" class="mono" font-size="11" font-weight="700" fill="#38bdf8">
        01 // AGI &amp; AGENTIC SWARM ARCHITECTURE
      </text>

      <!-- Tech Badges -->
      <g transform="translate(14, 40)">
