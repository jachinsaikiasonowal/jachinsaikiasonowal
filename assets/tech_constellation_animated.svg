        <text x="65" y="16" text-anchor="middle" class="mono" font-size="9.5" fill="#bae6fd">PROMPTMATRIX SDK</text>

        <!-- Tag 2 -->
        <rect x="140" y="0" width="130" height="24" rx="4" fill="#0f2942" stroke="#0284c7" stroke-width="0.8"/>
        <text x="205" y="16" text-anchor="middle" class="mono" font-size="9.5" fill="#bae6fd">LangGraph / CrewAI</text>

        <!-- Tag 3 -->
